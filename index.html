<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(#1a0033, #000033);
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        h1 {
            margin: 10px 0 5px;
            font-size: 2.2em;
            text-shadow: 0 0 10px #ff00ff;
        }
        .scores {
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        #game-container {
            position: relative;
            border: 4px solid #ffffff33;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
            background: #000;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 8px;
        }
        button {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 28px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        button:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.3);
        }
        #restart {
            margin-top: 5px;
            padding: 12px 30px;
            font-size: 18px;
            width: auto;
            height: auto;
        }
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            border: 3px solid #ff00ff;
            display: none;
            z-index: 10;
        }
        .overlay button {
            margin-top: 20px;
            padding: 12px 40px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Rainbow Snake</h1>
    <div class="scores" id="score">Score: 0 | High Score: 0</div>
    <div id="game-container">
        <canvas id="game" width="400" height="400"></canvas>
        <div class="overlay" id="gameOver">
            <h2>Game Over!</h2>
            <p id="finalScore">Score: 0</p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <div class="controls">
        <div class="dpad">
            <div></div>
            <button onclick="changeDir(0, -1)">↑</button>
            <div></div>
            <button onclick="changeDir(-1, 0)">←</button>
            <button onclick="changeDir(0, 1)">↓</button>
            <button onclick="changeDir(1, 0)">→</button>
        </div>
        <button id="restart" onclick="restartGame()">Restart Game</button>
    </div>

    <p style="margin-top: 15px; font-size: 0.9em; opacity: 0.8;">Tap arrow buttons or swipe on the game area to move</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;
        const rows = canvas.height / grid;
        const cols = canvas.width / grid;

        let snake = [{x: 10, y: 10}];
        let dx = 1;
        let dy = 0;
        let food = {};
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let gameInterval;
        let gameSpeed = 120;
        let directionQueue = [];
        let isGameOver = false;

        const rainbowColors = ['#00ff00', '#00ffff', '#0080ff', '#8000ff', '#ff00ff', '#ff0080', '#ff0000', '#ff8000', '#ffff00'];

        function randomFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows),
                    color: rainbowColors[(snake.length) % rainbowColors.length]
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            snake.forEach((segment, i) => {
                ctx.fillStyle = rainbowColors[i % rainbowColors.length];
                ctx.fillRect(segment.x * grid, segment.y * grid, grid, grid);
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 2;
                ctx.strokeRect(segment.x * grid + 2, segment.y * grid + 2, grid - 4, grid - 4);

                // Head
                if (i === 0) {
                    // Eyes
                    ctx.fillStyle = '#000';
                    let eyeOffsetX = dx * 5;
                    let eyeOffsetY = dy * 5;
                    ctx.fillRect(segment.x * grid + 6 + eyeOffsetX, segment.y * grid + 6, 5, 5);
                    ctx.fillRect(segment.x * grid + 12 + eyeOffsetX, segment.y * grid + 6, 5, 5);

                    // Tongue
                    ctx.strokeStyle = '#ff2222';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    let tx = segment.x * grid + grid/2 + dx * 12;
                    let ty = segment.y * grid + grid/2 + dy * 8;
                    ctx.moveTo(segment.x * grid + grid/2, segment.y * grid + grid/2);
                    ctx.lineTo(tx, ty);
                    ctx.stroke();

                    // Fork
                    ctx.beginPath();
                    ctx.moveTo(tx, ty);
                    ctx.lineTo(tx - 4, ty - 4);
                    ctx.moveTo(tx, ty);
                    ctx.lineTo(tx + 4, ty - 4);
                    ctx.stroke();
                }
            });

            // Draw food
            ctx.fillStyle = food.color;
            ctx.beginPath();
            ctx.arc(food.x * grid + grid/2, food.y * grid + grid/2, grid/2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function update() {
            if (isGameOver) return;

            // Process queued direction
            if (directionQueue.length > 0) {
                const nextDir = directionQueue.shift();
                if (!(nextDir.dx === -dx && nextDir.dy === -dy)) {
                    dx = nextDir.dx;
                    dy = nextDir.dy;
                }
            }

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Wall collision
            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                endGame();
                return;
            }

            // Self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').textContent = `Score: ${score} | High Score: ${highScore}`;
                randomFood();
                if (gameSpeed > 50) gameSpeed -= 3;
            } else {
                snake.pop();
            }

            draw();
        }

        function gameLoop() {
            update();
        }

        function startGame() {
            clearInterval(gameInterval);
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            gameSpeed = 140;
            directionQueue = [];
            isGameOver = false;
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('score').textContent = `Score: 0 | High Score: ${highScore}`;
            randomFood();
            draw();
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }
            document.getElementById('finalScore').textContent = `Score: ${score}`;
            document.getElementById('gameOver').style.display = 'block';
        }

        function changeDir(newDx, newDy) {
            if (isGameOver) return;
            directionQueue.push({dx: newDx, dy: newDy});
        }

        function restartGame() {
            startGame();
        }

        // Swipe support
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });

        canvas.addEventListener('touchend', e => {
            if (isGameOver) return;
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const dxTouch = touchEndX - touchStartX;
            const dyTouch = touchEndY - touchStartY;

            if (Math.abs(dxTouch) > 30 || Math.abs(dyTouch) > 30) {
                if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
                    changeDir(dxTouch > 0 ? 1 : -1, 0);
                } else {
                    changeDir(0, dyTouch > 0 ? 1 : -1);
                }
            }
        });

        // Keyboard support
        document.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': changeDir(0, -1); break;
                case 'ArrowDown': changeDir(0, 1); break;
                case 'ArrowLeft': changeDir(-1, 0); break;
                case 'ArrowRight': changeDir(1, 0); break;
            }
        });

        // Initial start
        window.onload = () => {
            document.getElementById('score').textContent = `Score: 0 | High Score: ${highScore}`;
            startGame();
        };
    </script>
</body>
</html>
