<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rainbow Snake</title>
<style>
body {margin:0;padding:0;background:linear-gradient(#2a004d,#000);color:white;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden;touch-action:none;}
h1 {margin:10px 0 5px;font-size:2.2em;text-shadow:0 0 15px #ff00ff;}
#score {font-size:1.2em;margin-bottom:10px;}
#game-container {position:relative;box-shadow:0 0 30px rgba(255,0,255,0.6);border:4px solid #fff;border-radius:12px;background:#000;}
canvas {display:block;image-rendering:pixelated;}
#controls {margin-top:15px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.dpad {display:grid;grid-template-columns:repeat(3,60px);gap:8px;}
button {background:rgba(255,255,255,0.15);color:white;border:none;border-radius:12px;font-size:1.8em;width:60px;height:60px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,0.4);}
button:active {background:rgba(255,255,255,0.4);transform:scale(0.95);}
#restart {margin-top:5px;padding:12px 30px;font-size:1.1em;width:auto;}
#game-over {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:30px 40px;border-radius:16px;text-align:center;border:3px solid #ff00ff;display:none;z-index:10;}
</style>
</head>
<body>
<h1>Rainbow Snake</h1>
<div id="score">Score: 0 | High Score: 0</div>
<div id="game-container">
<canvas id="game" width="400" height="400"></canvas>
<div id="game-over">
<h2>Game Over!</h2>
<p id="final-score">Score: 0</p>
<button id="play-again">Play Again</button>
</div>
</div>
<div id="controls">
<button id="up">↑</button>
<div class="dpad">
<button id="left">←</button>
<button id="down">↓</button>
<button id="right">→</button>
</div>
<button id="restart">Restart Game</button>
</div>
<p style="margin-top:10px;font-size:0.9em;opacity:0.8;">Tap arrow buttons or swipe on the game area to move</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
const cols = canvas.width / grid;
const rows = canvas.height / grid;

let snake = [{x:10,y:10}];
let dx=1, dy=0;
let food = {};
let score = 0;
let highScore = localStorage.getItem('highScore')||0;
let gameInterval, gameSpeed=140;
let directionChanged = false;
let tongueFrame = 0;

const colors = ['#00ff00','#00ffff','#0000ff','#8a2be2','#ff00ff','#ff0000','#ff7f00','#ffff00'];

function randomFood() {
  food = {x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows), color:colors[snake.length % colors.length]};
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for (let i=0; i<snake.length; i++) {
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(snake[i].x*grid+1, snake[i].y*grid+1, grid-2, grid-2);

    if (i===0) {
      const h = snake[0];
      const hx = h.x * grid;
      const hy = h.y * grid;

      // Bigger solid black eyes - positioned near the front
      ctx.fillStyle = '#111';
      const es = 5;
      if (dx === 1) {
        ctx.fillRect(hx + 12, hy + 5, es, es);
        ctx.fillRect(hx + 12, hy + 12, es, es);
      } else if (dx === -1) {
        ctx.fillRect(hx + 3, hy + 5, es, es);
        ctx.fillRect(hx + 3, hy + 12, es, es);
      } else if (dy === -1) {
        ctx.fillRect(hx + 5, hy + 3, es, es);
        ctx.fillRect(hx + 12, hy + 3, es, es);
      } else {
        ctx.fillRect(hx + 5, hy + 12, es, es);
        ctx.fillRect(hx + 12, hy + 12, es, es);
      }

      // Tongue starts at the EDGE of the head and sticks cleanly OUT. Small external Y-fork.
      ctx.strokeStyle = '#ff2222';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const f = Math.sin(tongueFrame) * 1.5;
      const tongueLen = 8;

      if (dx === 1) { // right
        const startX = hx + grid - 1;
        const startY = hy + grid/2;
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX + tongueLen, startY - 2 + f);
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX + tongueLen, startY + 2 - f);
      } else if (dx === -1) { // left
        const startX = hx + 1;
        const startY = hy + grid/2;
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX - tongueLen, startY - 2 + f);
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX - tongueLen, startY + 2 - f);
      } else if (dy === -1) { // up
        const startX = hx + grid/2;
        const startY = hy + 1;
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX - 2 + f, startY - tongueLen);
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX + 2 - f, startY - tongueLen);
      } else { // down
        const startX = hx + grid/2;
        const startY = hy + grid - 1;
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX - 2 + f, startY + tongueLen);
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX + 2 - f, startY + tongueLen);
      }
      ctx.stroke();
    }
  }

  ctx.fillStyle = food.color;
  ctx.beginPath();
  ctx.arc(food.x*grid + 10, food.y*grid + 10, 7, 0, Math.PI*2);
  ctx.fill();
}

function update() {
  directionChanged = false;
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  if (head.x<0 || head.x>=cols || head.y<0 || head.y>=rows || snake.some(s=>s.x===head.x && s.y===head.y)) {
    gameOver();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = `Score: ${score} | High Score: ${highScore}`;
    randomFood();
    if (gameSpeed > 70) gameSpeed -= 4;
  } else snake.pop();
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('highScore', highScore);
  }
  draw();
  tongueFrame += 0.25;
}

function gameOver() {
  clearInterval(gameInterval);
  document.getElementById('final-score').textContent = `Score: ${score}`;
  document.getElementById('game-over').style.display = 'block';
}

function startGame() {
  snake = [{x:10,y:10}];
  dx=1; dy=0;
  score=0;
  gameSpeed=140;
  document.getElementById('score').textContent = `Score: 0 | High Score: ${highScore}`;
  document.getElementById('game-over').style.display = 'none';
  randomFood();
  clearInterval(gameInterval);
  gameInterval = setInterval(update, gameSpeed);
  draw();
}

document.getElementById('up').onclick = () => changeDirection(0,-1);
document.getElementById('down').onclick = () => changeDirection(0,1);
document.getElementById('left').onclick = () => changeDirection(-1,0);
document.getElementById('right').onclick = () => changeDirection(1,0);
document.getElementById('restart').onclick = startGame;
document.getElementById('play-again').onclick = startGame;

function changeDirection(ndx, ndy) {
  if (directionChanged || (ndx === -dx && ndy === -dy)) return;
  dx = ndx; dy = ndy;
  directionChanged = true;
}

let tsX, tsY;
canvas.addEventListener('touchstart', e=>{tsX=e.touches[0].clientX; tsY=e.touches[0].clientY;});
canvas.addEventListener('touchend', e=>{
  const dX = e.changedTouches[0].clientX - tsX;
  const dY = e.changedTouches[0].clientY - tsY;
  if (Math.abs(dX) > Math.abs(dY)) changeDirection(dX>40?1:-1, 0);
  else changeDirection(0, dY>40?1:-1);
});

document.addEventListener('keydown', e=> {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowUp') changeDirection(0,-1);
  if (e.key === 'ArrowDown') changeDirection(0,1);
  if (e.key === 'ArrowLeft') changeDirection(-1,0);
  if (e.key === 'ArrowRight') changeDirection(1,0);
});

startGame();
</script>
</body>
</html>
