<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            font-family: 'Courier New', monospace;
            color: white;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .score {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Rainbow Snake</h1>
    <div class="score">Score: <span id="score">0</span> | High Score: <span id="highScore">0</span></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>
    <div class="controls">
        <button onclick="changeDirection(0)">↑</button>
    </div>
    <div class="controls">
        <button onclick="changeDirection(3)">←</button>
        <button onclick="changeDirection(1)">↓</button>
        <button onclick="changeDirection(2)">→</button>
    </div>
    <button onclick="restartGame()">Restart Game</button>
    <p>Tap arrow buttons or swipe on the game area to move</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            {x: 10, y: 10}
        ];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('highScore')) || 0;
        let gameInterval;
        let gameSpeed = 100;

        document.getElementById('highScore').textContent = highScore;

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    randomFood();
                    return;
                }
            }
        }

        function drawGame() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('highScore', highScore);
                    document.getElementById('highScore').textContent = highScore;
                }
                randomFood();
                if (gameSpeed > 50) gameSpeed -= 2;
                clearInterval(gameInterval);
                gameInterval = setInterval(drawGame, gameSpeed);
            } else {
                snake.pop();
            }

            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            snake.forEach((segment, index) => {
                const hue = (Date.now() / 10 + index * 30) % 360;
                ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });

            ctx.fillStyle = '#ff0';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameOver() {
            clearInterval(gameInterval);
            if (confirm(`Game Over! Score: ${score}\nPlay again?`)) {
                resetGame();
                startGame();
            }
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = dy = 0;
            score = 0;
            document.getElementById('score').textContent = score;
            gameSpeed = 100;
            randomFood();
        }

        function startGame() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(drawGame, gameSpeed);
        }

        function changeDirection(dir) {
            const opposite = {0:1, 1:0, 2:3, 3:2};
            if (dir === opposite[(dx===1?2:(dx===-1?3:(dy===1?1:0)))]) return;
            if (dir === 0 && dy !== 1) { dx = 0; dy = -1; }
            else if (dir === 1 && dy !== -1) { dx = 0; dy = 1; }
            else if (dir === 2 && dx !== -1) { dx = 1; dy = 0; }
            else if (dir === 3 && dx !== 1) { dx = -1; dy = 0; }
        }

        document.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': changeDirection(0); break;
                case 'ArrowDown': changeDirection(1); break;
                case 'ArrowRight': changeDirection(2); break;
                case 'ArrowLeft': changeDirection(3); break;
            }
        });

        // Touch swipe
        let touchStartX, touchStartY;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        canvas.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                changeDirection(deltaX > 0 ? 2 : 3);
            } else {
                changeDirection(deltaY > 0 ? 1 : 0);
            }
        }, false);

        randomFood();
        startGame();

        function restartGame() {
            resetGame();
            startGame();
        }
    </script>
</body>
</html>
