<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Snake</title>
    <style>
        body {
            margin: 0;
            padding: 40px 0 20px;
            background: #1a0033;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 2.1em;
            font-weight: 700;
            letter-spacing: -1px;
        }
        #score {
            font-size: 1em;
            margin-bottom: 12px;
            color: #cccccc;
        }
        #game-container {
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 3px solid #ffffff33;
            border-radius: 16px;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #restart {
            position: absolute;
            top: 50%;
            right: -38px;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #0088ff;
            color: white;
            border: 2px solid #ffffff55;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,136,255,0.4);
            z-index: 20;
        }
        .controls {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 6px;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #ffffff33;
            border-radius: 12px;
            font-size: 24px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:active {
            background: #444;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px 16px;
            border-radius: 14px;
            text-align: center;
            display: none;
            border: 2px solid #ff00ff;
            width: 80%;
            max-width: 220px;
            box-sizing: border-box;
        }
        #gameOver h2 {
            color: #ff3333;
            margin: 0 0 8px 0;
            font-size: 1.4em;
        }
        #gameOver button {
            background: #1a001a;
            color: white;
            border: 2px solid #ff00ff;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 15px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>Rainbow Snake</h1>
    <div id="score">Score: 0 | High Score: 0</div>
    <div id="debug">v14.6.19 - fresh minimal version</div>

    <div id="game-container">
        <canvas id="game" width="400" height="400"></canvas>
        <button id="restart" onclick="restartGame()">⟳</button>
        <div id="gameOver">
            <h2>Game Over!</h2>
            <p id="finalScore">Score: 0</p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <div class="controls">
        <button id="up">↑</button>
        <div class="dpad">
            <button id="left">←</button>
            <button id="down">↓</button>
            <button id="right">→</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;
        let snake = [{x: 10, y: 10}];
        let dx = 1;
        let dy = 0;
        let food = {};
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let gameInterval;
        let speed = 200;
        let gameOverFlag = false;

        document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / grid)),
                y: Math.floor(Math.random() * (canvas.height / grid))
            };
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            ctx.fillStyle = '#00ff00';
            for (let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * grid, snake[i].y * grid, grid - 2, grid - 2);
            }

            // Draw food
            ctx.fillStyle = '#ff00ff';
            ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);
        }

        function update() {
            if (gameOverFlag) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= canvas.width/grid || head.y < 0 || head.y >= canvas.height/grid || snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
                randomFood();
            } else {
                snake.pop();
            }

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }

            draw();
        }

        function gameOver() {
            gameOverFlag = true;
            clearInterval(gameInterval);
            document.getElementById('finalScore').innerText = `Score: ${score}`;
            document.getElementById('gameOver').style.display = 'block';
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            speed = 200;
            gameOverFlag = false;
            document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
            document.getElementById('gameOver').style.display = 'none';
            randomFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(update, speed);
            draw();
        }

        function restartGame() {
            startGame();
        }

        document.getElementById('up').addEventListener('click', () => { if (dy !== 1) { dx = 0; dy = -1; } });
        document.getElementById('down').addEventListener('click', () => { if (dy !== -1) { dx = 0; dy = 1; } });
        document.getElementById('left').addEventListener('click', () => { if (dx !== 1) { dx = -1; dy = 0; } });
        document.getElementById('right').addEventListener('click', () => { if (dx !== -1) { dx = 1; dy = 0; } });

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; }
            if (e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; }
            if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
            if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
        });

        startGame();
    </script>
</body>
</html>
