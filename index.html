<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(#2a0033, #000033);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }
        h1 {
            margin: 10px 0 5px;
            font-size: 2.5em;
            text-shadow: 0 0 15px #ff00ff;
        }
        #score {
            font-size: 1.2em;
            margin-bottom: 10px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px #ff00ff;
            border: 4px solid #ffffff33;
            border-radius: 12px;
            background: #000;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 8px;
        }
        button {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 28px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, background 0.1s ease;
        }
        button:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.3);
        }
        #restart {
            position: absolute;
            bottom: 5px;
            right: -48px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #0088ff;
            color: white;
            border: 2px solid #ffffff55;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(0,136,255,0.45);
            transition: transform 0.1s ease, background 0.1s ease, box-shadow 0.1s ease;
            z-index: 20;
            padding: 0;
            line-height: 1;
            cursor: pointer;
        }
        #restart:active {
            transform: scale(0.88);
            background: #0066cc;
            box-shadow: 0 1px 6px rgba(0,136,255,0.7);
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92);
            padding: 24px 20px;
            border-radius: 18px;
            text-align: center;
            display: none;
            border: 3px solid #ff00ff;
            box-shadow: 0 0 25px rgba(255,0,255,0.4);
            z-index: 10;
            width: 82%;
            max-width: 260px;
            box-sizing: border-box;
        }
        #gameOver h2 {
            color: #ff3333;
            font-weight: bold;
            text-shadow: 0 0 10px #ff3333, 0 0 20px #ff0000;
            animation: pulseGlow 1.6s infinite ease-in-out;
            margin: 0 0 6px 0;
            font-size: 1.55em;
        }
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 8px #ff3333, 0 0 18px #ff0000; }
            50% { text-shadow: 0 0 22px #ff3333, 0 0 38px #ff0000; }
        }
        #gameOver p {
            margin: 6px 0 16px;
            color: #cccccc;
            font-size: 1.05em;
        }
        #gameOver button {
            display: block;
            margin: 0 auto;
            background: #1a001a;
            color: #ffffff;
            border: 2px solid #ff00ff;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 16px;
            min-height: 44px;
            min-width: 120px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255,0,255,0.35);
            transition: all 0.1s ease;
        }
        #gameOver button:active {
            transform: scale(0.96);
            background: #330033;
            box-shadow: 0 0 18px #ff00ff;
        }
        #debug {
            font-size: 11px;
            opacity: 0.35;
            margin-top: 6px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>Rainbow Snake</h1>
    <div id="score">Score: 0 | High Score: 0</div>
    <div id="debug">v10.4 - smol cute tongue + visible flick + head poof</div>

    <div id="game-container">
        <canvas id="game" width="400" height="400"></canvas>
        <button id="restart" onclick="restartGame()" aria-label="Restart game">⟳</button>
        <div id="gameOver">
            <h2>Game Over!</h2>
            <p id="finalScore">Score: 0</p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <div class="controls">
        <button id="up">↑</button>
        <div class="dpad">
            <button id="left">←</button>
            <button id="down">↓</button>
            <button id="right">→</button>
        </div>
    </div>
    <p style="margin-top:10px; opacity:0.7;">Tap arrow buttons or swipe on the game area to move</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;
        let snake = [{x: 10, y: 10}];
        let dx = 1;
        let dy = 0;
        let food = {};
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let gameInterval;
        let speed = 180;
        let gameOverFlag = false;
        let tongueFrame = 0;
        let eatEffect = 0;

        document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;

        const rainbowColors = ['#00ff00', '#00ffff', '#0088ff', '#4400ff', '#aa00ff', '#ff00ff', '#ff0088', '#ff4400', '#ffaa00', '#ffff00'];

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / grid)),
                y: Math.floor(Math.random() * (canvas.height / grid)),
                color: rainbowColors[snake.length % rainbowColors.length]
            };
        }

        // Twinkling starfield inside game canvas
        let stars = [];
        function initStars() {
            stars = [];
            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            const time = Date.now() / 200;
            stars.forEach(star => {
                ctx.globalAlpha = 0.5 + Math.sin(time + star.x * 0.1) * 0.5;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars();

            // Body segments with stronger subtle white outline for better definition
            for (let i = 1; i < snake.length; i++) {
                ctx.fillStyle = rainbowColors[ i % rainbowColors.length ];
                ctx.fillRect(snake[i].x * grid + 1, snake[i].y * grid + 1, grid - 2, grid - 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.38)';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(snake[i].x * grid + 1, snake[i].y * grid + 1, grid - 2, grid - 2);
            }

            // Head always green with stronger subtle white outline
            const head = snake[0];
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(head.x * grid + 1, head.y * grid + 1, grid - 2, grid - 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 1.8;
            ctx.strokeRect(head.x * grid + 1, head.y * grid + 1, grid - 2, grid - 2);

            // Eyes - refined with subtle specular highlight for cuter, more polished look
            ctx.fillStyle = '#111111';
            const eyeSize = 5.5;
            const highlightSize = 1.8;
            if (dx === 1) { // right
                ctx.fillRect(head.x*grid + 12.5, head.y*grid + 5.5, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 12.5, head.y*grid + 12.5, eyeSize, eyeSize);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(head.x*grid + 13.2, head.y*grid + 6.2, highlightSize, highlightSize);
                ctx.fillRect(head.x*grid + 13.2, head.y*grid + 13.2, highlightSize, highlightSize);
            } else if (dx === -1) { // left
                ctx.fillRect(head.x*grid + 2.5, head.y*grid + 5.5, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 2.5, head.y*grid + 12.5, eyeSize, eyeSize);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(head.x*grid + 3.2, head.y*grid + 6.2, highlightSize, highlightSize);
                ctx.fillRect(head.x*grid + 3.2, head.y*grid + 13.2, highlightSize, highlightSize);
            } else if (dy === -1) { // up
                ctx.fillRect(head.x*grid + 5.5, head.y*grid + 2.5, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 12.5, head.y*grid + 2.5, eyeSize, eyeSize);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(head.x*grid + 6.2, head.y*grid + 3.2, highlightSize, highlightSize);
                ctx.fillRect(head.x*grid + 13.2, head.y*grid + 3.2, highlightSize, highlightSize);
            } else { // down
                ctx.fillRect(head.x*grid + 5.5, head.y*grid + 12.5, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 12.5, head.y*grid + 12.5, eyeSize, eyeSize);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(head.x*grid + 6.2, head.y*grid + 13.2, highlightSize, highlightSize);
                ctx.fillRect(head.x*grid + 13.2, head.y*grid + 13.2, highlightSize, highlightSize);
            }

            // Smol cute Y-forked tongue with nice visible flick (size kept small & cute)
            ctx.strokeStyle = '#ff2222';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            tongueFrame += 0.35; // slightly faster for visible flick
            const flick = Math.sin(tongueFrame) * 1.15; // nice noticeable flick amplitude
            const hx = head.x * grid;
            const hy = head.y * grid;
            const stemLen = 4;
            const forkLen = 5;
            const spread = 3.2;

            ctx.beginPath();
            if (dx === 1) { // right
                ctx.moveTo(hx + grid - 2, hy + grid/2);
                ctx.lineTo(hx + grid + stemLen, hy + grid/2 + flick * 0.4);
                ctx.moveTo(hx + grid + stemLen, hy + grid/2 + flick * 0.4);
                ctx.lineTo(hx + grid + stemLen + forkLen, hy + grid/2 + flick * 0.4 - spread);
                ctx.moveTo(hx + grid + stemLen, hy + grid/2 + flick * 0.4);
                ctx.lineTo(hx + grid + stemLen + forkLen, hy + grid/2 + flick * 0.4 + spread);
            } else if (dx === -1) { // left
                ctx.moveTo(hx + 2, hy + grid/2);
                ctx.lineTo(hx - stemLen, hy + grid/2 + flick * 0.4);
                ctx.moveTo(hx - stemLen, hy + grid/2 + flick * 0.4);
                ctx.lineTo(hx - stemLen - forkLen, hy + grid/2 + flick * 0.4 - spread);
                ctx.moveTo(hx - stemLen, hy + grid/2 + flick * 0.4);
                ctx.lineTo(hx - stemLen - forkLen, hy + grid/2 + flick * 0.4 + spread);
            } else if (dy === -1) { // up
                ctx.moveTo(hx + grid/2, hy + 2);
                ctx.lineTo(hx + grid/2 + flick * 0.3, hy - stemLen);
                ctx.moveTo(hx + grid/2 + flick * 0.3, hy - stemLen);
                ctx.lineTo(hx + grid/2 + flick * 0.3 - spread, hy - stemLen - forkLen);
                ctx.moveTo(hx + grid/2 + flick * 0.3, hy - stemLen);
                ctx.lineTo(hx + grid/2 + flick * 0.3 + spread, hy - stemLen - forkLen);
            } else { // down
                ctx.moveTo(hx + grid/2, hy + grid - 2);
                ctx.lineTo(hx + grid/2 + flick * 0.3, hy + grid + stemLen);
                ctx.moveTo(hx + grid/2 + flick * 0.3, hy + grid + stemLen);
                ctx.lineTo(hx + grid/2 + flick * 0.3 - spread, hy + grid + stemLen + forkLen);
                ctx.moveTo(hx + grid/2 + flick * 0.3, hy + grid + stemLen);
                ctx.lineTo(hx + grid/2 + flick * 0.3 + spread, hy + grid + stemLen + forkLen);
            }
            ctx.stroke();

            // Subtle poof near head/mouth + faint ring around food on eat
            if (eatEffect > 0) {
                // Head poof near mouth (slightly more visible)
                ctx.save();
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                const poofX = head.x * grid + grid/2;
                const poofY = head.y * grid + grid/2;
                const offset = (12 - eatEffect) * 0.6;
                ctx.fillRect(poofX - 2.5 - offset*0.25, poofY - 3.5, 2.2, 2.2);
                ctx.fillRect(poofX + 3.5 + offset*0.2, poofY - 2, 2.2, 2.2);
                ctx.fillRect(poofX - 1, poofY + 4.5 + offset*0.35, 2.2, 2.2);
                ctx.fillStyle = 'rgba(255,180,255,0.65)';
                ctx.fillRect(poofX + 1.5 - offset*0.1, poofY - 5.5 - offset*0.15, 2.8, 2.8);
                ctx.restore();

                // Faint pulsing ring around food
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                ctx.lineWidth = 2;
                const ringRadius = 7 + (12 - eatEffect) * 1.1;
                ctx.beginPath();
                ctx.arc(food.x * grid + grid/2, food.y * grid + grid/2, ringRadius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                eatEffect--;
            }

            // Smaller food with stronger pulsing glow
            const pulse = Math.sin(Date.now() / 300) * 9.5 + 16;
            ctx.save();
            ctx.shadowColor = food.color || rainbowColors[snake.length % rainbowColors.length];
            ctx.shadowBlur = pulse;
            ctx.fillStyle = food.color || rainbowColors[snake.length % rainbowColors.length];
            ctx.beginPath();
            ctx.arc(food.x * grid + grid/2, food.y * grid + grid/2, 6.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function update() {
            if (gameOverFlag) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= canvas.width/grid || head.y < 0 || head.y >= canvas.height/grid || snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
                eatEffect = 12;
                randomFood();
                if (speed > 90) speed -= 3;
            } else {
                snake.pop();
            }

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }

            draw();
        }

        function gameOver() {
            gameOverFlag = true;
            clearInterval(gameInterval);
            document.getElementById('finalScore').innerText = `Score: ${score}`;
            document.getElementById('gameOver').style.display = 'block';
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            speed = 180;
            gameOverFlag = false;
            eatEffect = 0;
            document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
            document.getElementById('gameOver').style.display = 'none';
            randomFood();
            initStars();
            clearInterval(gameInterval);
            gameInterval = setInterval(update, speed);
            draw();
        }

        function restartGame() {
            startGame();
        }

        // Controls
        document.getElementById('up').addEventListener('click', () => { if (dy !== 1) { dx = 0; dy = -1; } });
        document.getElementById('down').addEventListener('click', () => { if (dy !== -1) { dx = 0; dy = 1; } });
        document.getElementById('left').addEventListener('click', () => { if (dx !== 1) { dx = -1; dy = 0; } });
        document.getElementById('right').addEventListener('click', () => { if (dx !== -1) { dx = 1; dy = 0; } });

        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });
        canvas.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30) dx = 1, dy = 0;
                else if (diffX < -30) dx = -1, dy = 0;
            } else {
                if (diffY > 30) dx = 0, dy = 1;
                else if (diffY < -30) dx = 0, dy = -1;
            }
        });

        document.addEventListener('keydown', e => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key) > -1) e.preventDefault();
            if (e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; }
            if (e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; }
            if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
            if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
        });

        startGame();
    </script>
</body>
</html>
