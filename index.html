<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(#2a0033, #000033);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }
        h1 {
            margin: 10px 0 5px;
            font-size: 2.5em;
            text-shadow: 0 0 15px #ff00ff;
        }
        #score {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px #ff00ff;
            border: 4px solid #ffffff33;
            border-radius: 12px;
            background: #000;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 8px;
        }
        button {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 28px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #restart {
            margin-top: 10px;
            padding: 12px 30px;
            font-size: 18px;
            width: auto;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            border: 3px solid #ff00ff;
            z-index: 10;
        }
        #bottom-space {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 110px;
            background: #000011;
            margin: 8px auto 0;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(50, 0, 100, 0.4);
            border: 2px solid #ffffff22;
        }
        .pixel-star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 4px #ffffff, 0 0 8px #aaaaff;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>Rainbow Snake</h1>
    <div id="score">Score: 0 | High Score: 0</div>
    <div id="game-container">
        <canvas id="game" width="400" height="400"></canvas>
        <div id="gameOver">
            <h2>Game Over!</h2>
            <p id="finalScore">Score: 0</p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <div id="bottom-space"></div>

    <div class="controls">
        <button id="up">↑</button>
        <div class="dpad">
            <button id="left">←</button>
            <button id="down">↓</button>
            <button id="right">→</button>
        </div>
        <button id="restart">Restart Game</button>
    </div>
    <p style="margin-top:8px; opacity:0.7; font-size:0.9em;">Tap arrow buttons or swipe on the game area to move</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;
        let snake = [{x: 10, y: 10}];
        let dx = 1;
        let dy = 0;
        let food = {};
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let gameInterval;
        let speed = 180;
        let gameOverFlag = false;
        let tongueFrame = 0;

        document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;

        const rainbowColors = ['#00ff00', '#00ffff', '#0088ff', '#4400ff', '#aa00ff', '#ff00ff', '#ff0088', '#ff4400', '#ffaa00', '#ffff00'];

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / grid)),
                y: Math.floor(Math.random() * (canvas.height / grid)),
                color: rainbowColors[snake.length % rainbowColors.length]
            };
        }

        // Twinkling starfield inside game canvas
        let stars = [];
        function initStars() {
            stars = [];
            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            const time = Date.now() / 200;
            stars.forEach(star => {
                ctx.globalAlpha = 0.5 + Math.sin(time + star.x * 0.1) * 0.5;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        // Simple pixel art starfield in the bottom empty space
        function createBottomPixelStars() {
            const container = document.getElementById('bottom-space');
            if (!container) return;
            container.innerHTML = '';
            const numStars = 42;
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'pixel-star';
                const size = Math.random() * 2.8 + 1.2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = (Math.random() * 98 + 1) + '%';
                star.style.top = (Math.random() * 92 + 4) + '%';
                star.style.opacity = (Math.random() * 0.65 + 0.35).toFixed(2);
                container.appendChild(star);
            }

            // Gentle twinkling animation for cute pixel art effect
            setInterval(() => {
                const starsList = container.querySelectorAll('.pixel-star');
                if (starsList.length === 0) return;
                const randomIndex = Math.floor(Math.random() * starsList.length);
                const s = starsList[randomIndex];
                if (s && s.parentNode) {
                    const originalOpacity = s.style.opacity || '0.6';
                    s.style.opacity = (Math.random() * 0.85 + 0.15).toFixed(2);
                    setTimeout(() => {
                        if (s && s.parentNode) s.style.opacity = originalOpacity;
                    }, 380);
                }
            }, 280);
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars();

            // Body segments - start from next color after head green
            for (let i = 1; i < snake.length; i++) {
                ctx.fillStyle = rainbowColors[ i % rainbowColors.length ];
                ctx.fillRect(snake[i].x * grid + 1, snake[i].y * grid + 1, grid - 2, grid - 2);
            }

            // Head always green
            const head = snake[0];
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(head.x * grid + 1, head.y * grid + 1, grid - 2, grid - 2);

            // Eyes - solid black, centered
            ctx.fillStyle = '#111111';
            const eyeSize = 5;
            if (dx === 1) { // right
                ctx.fillRect(head.x*grid + 12, head.y*grid + 6, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 12, head.y*grid + 13, eyeSize, eyeSize);
            } else if (dx === -1) { // left
                ctx.fillRect(head.x*grid + 3, head.y*grid + 6, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 3, head.y*grid + 13, eyeSize, eyeSize);
            } else if (dy === -1) { // up
                ctx.fillRect(head.x*grid + 6, head.y*grid + 3, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 13, head.y*grid + 3, eyeSize, eyeSize);
            } else { // down
                ctx.fillRect(head.x*grid + 6, head.y*grid + 12, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 13, head.y*grid + 12, eyeSize, eyeSize);
            }

            // Smaller, cuter Y-forked tongue
            ctx.strokeStyle = '#ff2222';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            tongueFrame += 0.3;
            const flick = Math.sin(tongueFrame) * 0.9;
            const hx = head.x * grid;
            const hy = head.y * grid;
            const stemLen = 4;
            const forkLen = 5;
            const spread = 3;

            ctx.beginPath();
            if (dx === 1) { // right
                ctx.moveTo(hx + grid - 2, hy + grid/2);
                ctx.lineTo(hx + grid + stemLen, hy + grid/2 + flick * 0.4);
                ctx.moveTo(hx + grid + stemLen, hy + grid/2 + flick * 0.4);
                ctx.lineTo(hx + grid + stemLen + forkLen, hy + grid/2 + flick * 0.4 - spread);
                ctx.moveTo(hx + grid + stemLen, hy + grid/2 + flick * 0.4);
                ctx.lineTo(hx + grid + stemLen + forkLen, hy + grid/2 + flick * 0.4 + spread);
            } else if (dx === -1) { // left
                ctx.moveTo(hx + 2, hy + grid/2);
                ctx.lineTo(hx - stemLen, hy + grid/2 + flick * 0.4);
                ctx.moveTo(hx - stemLen, hy + grid/2 + flick * 0.4);
                ctx.lineTo(hx - stemLen - forkLen, hy + grid/2 + flick * 0.4 - spread);
                ctx.moveTo(hx - stemLen, hy + grid/2 + flick * 0.4);
                ctx.lineTo(hx - stemLen - forkLen, hy + grid/2 + flick * 0.4 + spread);
            } else if (dy === -1) { // up
                ctx.moveTo(hx + grid/2, hy + 2);
                ctx.lineTo(hx + grid/2 + flick * 0.3, hy - stemLen);
                ctx.moveTo(hx + grid/2 + flick * 0.3, hy - stemLen);
                ctx.lineTo(hx + grid/2 + flick * 0.3 - spread, hy - stemLen - forkLen);
                ctx.moveTo(hx + grid/2 + flick * 0.3, hy - stemLen);
                ctx.lineTo(hx + grid/2 + flick * 0.3 + spread, hy - stemLen - forkLen);
            } else { // down
                ctx.moveTo(hx + grid/2, hy + grid - 2);
                ctx.lineTo(hx + grid/2 + flick * 0.3, hy + grid + stemLen);
                ctx.moveTo(hx + grid/2 + flick * 0.3, hy + grid + stemLen);
                ctx.lineTo(hx + grid/2 + flick * 0.3 - spread, hy + grid + stemLen + forkLen);
                ctx.moveTo(hx + grid/2 + flick * 0.3, hy + grid + stemLen);
                ctx.lineTo(hx + grid/2 + flick * 0.3 + spread, hy + grid + stemLen + forkLen);
            }
            ctx.stroke();

            // Food color matches the next segment color in the rainbow cycle
            ctx.fillStyle = food.color || rainbowColors[snake.length % rainbowColors.length];
            ctx.beginPath();
            ctx.arc(food.x * grid + grid/2, food.y * grid + grid/2, 7, 0, Math.PI * 2);
            ctx.fill();
        }

        function update() {
            if (gameOverFlag) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= canvas.width/grid || head.y < 0 || head.y >= canvas.height/grid || snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
                randomFood();
                if (speed > 90) speed -= 3;
            } else {
                snake.pop();
            }

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }

            draw();
        }

        function gameOver() {
            gameOverFlag = true;
            clearInterval(gameInterval);
            document.getElementById('finalScore').innerText = `Score: ${score}`;
            document.getElementById('gameOver').style.display = 'block';
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            speed = 180;
            gameOverFlag = false;
            document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
            document.getElementById('gameOver').style.display = 'none';
            randomFood();
            initStars();
            createBottomPixelStars();
            clearInterval(gameInterval);
            gameInterval = setInterval(update, speed);
            draw();
        }

        function restartGame() {
            startGame();
        }

        // Controls
        document.getElementById('up').addEventListener('click', () => { if (dy !== 1) { dx = 0; dy = -1; } });
        document.getElementById('down').addEventListener('click', () => { if (dy !== -1) { dx = 0; dy = 1; } });
        document.getElementById('left').addEventListener('click', () => { if (dx !== 1) { dx = -1; dy = 0; } });
        document.getElementById('right').addEventListener('click', () => { if (dx !== -1) { dx = 1; dy = 0; } });

        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });
        canvas.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30) dx = 1, dy = 0;
                else if (diffX < -30) dx = -1, dy = 0;
            } else {
                if (diffY > 30) dx = 0, dy = 1;
                else if (diffY < -30) dx = 0, dy = -1;
            }
        });

        document.addEventListener('keydown', e => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key) > -1) e.preventDefault();
            if (e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; }
            if (e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; }
            if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
            if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
        });

        document.getElementById('restart').addEventListener('click', restartGame);

        startGame();
    </script>
</body>
</html>
