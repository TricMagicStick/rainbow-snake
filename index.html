<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            font-family: 'Courier New', monospace;
            color: white;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 24px;
            font-size: 24px;
            background: rgba(255,255,255,0.9);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            min-width: 60px;
        }
        .score {
            font-size: 24px;
            margin: 10px 0;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <h1>Rainbow Snake</h1>
    <div class="score">Score: <span id="score">0</span> | High Score: <span id="highScore">0</span></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="gameOver">
            <h2>Game Over!</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>
    <div class="controls">
        <button onclick="changeDirection(0)">↑</button>
    </div>
    <div class="controls">
        <button onclick="changeDirection(3)">←</button>
        <button onclick="changeDirection(1)">↓</button>
        <button onclick="changeDirection(2)">→</button>
    </div>
    <button onclick="restartGame()">Restart Game</button>
    <p>Tap arrow buttons or swipe on the game area to move</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('highScore')) || 0;
        let gameInterval;
        let gameSpeed = 120;
        let gameRunning = false;
        let nextFoodColor = 0;

        const rainbowColors = [
            '#ff0000', '#ff7f00', '#ffff00', '#00ff00', 
            '#00ffff', '#0000ff', '#8b00ff'
        ];

        document.getElementById('highScore').textContent = highScore;

        function randomFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
            nextFoodColor = Math.floor(Math.random() * rainbowColors.length);
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake with solid colors per segment
            snake.forEach((segment, index) => {
                const colorIndex = index % rainbowColors.length;
                ctx.fillStyle = rainbowColors[colorIndex];
                ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);

                // Draw cute face on head (index 0)
                if (index === 0) {
                    drawSnakeHead(segment);
                }
            });

            // Draw food matching next segment color
            ctx.fillStyle = rainbowColors[nextFoodColor];
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawSnakeHead(head) {
            const x = head.x * gridSize;
            const y = head.y * gridSize;
            const size = gridSize;

            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath();
            if (dx === 1) { // right
                ctx.arc(x + size * 0.65, y + size * 0.35, size * 0.12, 0, Math.PI * 2);
                ctx.arc(x + size * 0.65, y + size * 0.65, size * 0.12, 0, Math.PI * 2);
            } else if (dx === -1) { // left
                ctx.arc(x + size * 0.35, y + size * 0.35, size * 0.12, 0, Math.PI * 2);
                ctx.arc(x + size * 0.35, y + size * 0.65, size * 0.12, 0, Math.PI * 2);
            } else if (dy === -1) { // up
                ctx.arc(x + size * 0.35, y + size * 0.35, size * 0.12, 0, Math.PI * 2);
                ctx.arc(x + size * 0.65, y + size * 0.35, size * 0.12, 0, Math.PI * 2);
            } else { // down
                ctx.arc(x + size * 0.35, y + size * 0.65, size * 0.12, 0, Math.PI * 2);
                ctx.arc(x + size * 0.65, y + size * 0.65, size * 0.12, 0, Math.PI * 2);
            }
            ctx.fill();

            // Pupils
            ctx.fillStyle = 'black';
            ctx.beginPath();
            if (dx === 1) {
                ctx.arc(x + size * 0.68, y + size * 0.35, size * 0.05, 0, Math.PI * 2);
                ctx.arc(x + size * 0.68, y + size * 0.65, size * 0.05, 0, Math.PI * 2);
            } else if (dx === -1) {
                ctx.arc(x + size * 0.32, y + size * 0.35, size * 0.05, 0, Math.PI * 2);
                ctx.arc(x + size * 0.32, y + size * 0.65, size * 0.05, 0, Math.PI * 2);
            } else if (dy === -1) {
                ctx.arc(x + size * 0.35, y + size * 0.32, size * 0.05, 0, Math.PI * 2);
                ctx.arc(x + size * 0.65, y + size * 0.32, size * 0.05, 0, Math.PI * 2);
            } else {
                ctx.arc(x + size * 0.35, y + size * 0.68, size * 0.05, 0, Math.PI * 2);
                ctx.arc(x + size * 0.65, y + size * 0.68, size * 0.05, 0, Math.PI * 2);
            }
            ctx.fill();

            // Forked tongue (flicking animation)
            const tongueLength = Math.sin(Date.now() / 100) * 3 + 8;
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 3;
            ctx.beginPath();
            if (dx === 1) {
                ctx.moveTo(x + size * 0.85, y + size * 0.5);
                ctx.lineTo(x + size + tongueLength, y + size * 0.5);
                ctx.moveTo(x + size + tongueLength * 0.7, y + size * 0.5 - 3);
                ctx.lineTo(x + size + tongueLength, y + size * 0.5);
                ctx.moveTo(x + size + tongueLength * 0.7, y + size * 0.5 + 3);
                ctx.lineTo(x + size + tongueLength, y + size * 0.5);
            } else if (dx === -1) {
                ctx.moveTo(x + size * 0.15, y + size * 0.5);
                ctx.lineTo(x - tongueLength, y + size * 0.5);
                ctx.moveTo(x - tongueLength * 0.7, y + size * 0.5 - 3);
                ctx.lineTo(x - tongueLength, y + size * 0.5);
                ctx.moveTo(x - tongueLength * 0.7, y + size * 0.5 + 3);
                ctx.lineTo(x - tongueLength, y + size * 0.5);
            } else if (dy === -1) {
                ctx.moveTo(x + size * 0.5, y + size * 0.15);
                ctx.lineTo(x + size * 0.5, y - tongueLength);
                ctx.moveTo(x + size * 0.5 - 3, y - tongueLength * 0.7);
                ctx.lineTo(x + size * 0.5, y - tongueLength);
                ctx.moveTo(x + size * 0.5 + 3, y - tongueLength * 0.7);
                ctx.lineTo(x + size * 0.5, y - tongueLength);
            } else {
                ctx.moveTo(x + size * 0.5, y + size * 0.85);
                ctx.lineTo(x + size * 0.5, y + size + tongueLength);
                ctx.moveTo(x + size * 0.5 - 3, y + size + tongueLength * 0.7);
                ctx.lineTo(x + size * 0.5, y + size + tongueLength);
                ctx.moveTo(x + size * 0.5 + 3, y + size + tongueLength * 0.7);
                ctx.lineTo(x + size * 0.5, y + size + tongueLength);
            }
            ctx.stroke();
        }

        function update() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('highScore', highScore);
                    document.getElementById('highScore').textContent = highScore;
                }
                // Add new segment with the food's color (already cycled by position)
                randomFood();
                if (gameSpeed > 60) gameSpeed -= 2;
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, gameSpeed);
            } else {
                snake.pop();
            }
        }

        function gameLoop() {
            update();
            draw();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function startGame() {
            if (gameInterval) clearInterval(gameInterval);
            gameRunning = true;
            dx = 1;
            dy = 0;
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            gameSpeed = 120;
            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
            randomFood();
        }

        function changeDirection(dir) {
            if (!gameRunning) return;

            // Prevent reversing
            if (dir === 0 && dy === 1) return;
            if (dir === 1 && dy === -1) return;
            if (dir === 2 && dx === -1) return;
            if (dir === 3 && dx === 1) return;

            if (dir === 0) { dx = 0; dy = -1; }
            else if (dir === 1) { dx = 0; dy = 1; }
            else if (dir === 2) { dx = 1; dy = 0; }
            else if (dir === 3) { dx = -1; dy = 0; }
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            switch(e.key) {
                case 'ArrowUp': changeDirection(0); break;
                case 'ArrowDown': changeDirection(1); break;
                case 'ArrowRight': changeDirection(2); break;
                case 'ArrowLeft': changeDirection(3); break;
            }
        });

        // Touch swipe
        let touchStartX, touchStartY;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });

        canvas.addEventListener('touchend', e => {
            if (!gameRunning) return;
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                changeDirection(deltaX > 0 ? 2 : 3);
            } else {
                changeDirection(deltaY > 0 ? 1 : 0);
            }
        });

        // Initial setup
        randomFood();
        draw();

        setTimeout(() => {
            if (dx === 0 && dy === 0) {
                startGame();
            }
        }, 800);

        function restartGame() {
            resetGame();
            startGame();
        }
    </script>
</body>
</html>
