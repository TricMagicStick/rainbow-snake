<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(#2a0033, #000033);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }
        h1 {
            margin: 10px 0 5px;
            font-size: 2.5em;
            text-shadow: 0 0 15px #ff00ff;
        }
        #score {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        #game {
            border: 4px solid #ffffff33;
            background: #000;
            box-shadow: 0 0 30px #ff00ff;
            position: relative;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 8px;
        }
        button {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 28px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #restart {
            margin-top: 10px;
            padding: 12px 30px;
            font-size: 18px;
            width: auto;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            border: 3px solid #ff00ff;
        }
    </style>
</head>
<body>
    <h1>Rainbow Snake</h1>
    <div id="score">Score: 0 | High Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>

    <div class="controls">
        <button id="up">↑</button>
        <div class="dpad">
            <button id="left">←</button>
            <button id="down">↓</button>
            <button id="right">→</button>
        </div>
        <button id="restart">Restart Game</button>
    </div>
    <p style="margin-top:10px; opacity:0.7;">Tap arrow buttons or swipe on the game area to move</p>

    <div id="gameOver">
        <h2>Game Over!</h2>
        <p id="finalScore">Score: 0</p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;
        let snake = [{x: 10, y: 10}];
        let dx = 1;
        let dy = 0;
        let food = {};
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let gameInterval;
        let speed = 180;
        let gameOverFlag = false;

        document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / grid)),
                y: Math.floor(Math.random() * (canvas.height / grid))
            };
        }

        // Simple twinkling starfield
        let stars = [];
        function initStars() {
            stars = [];
            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    alpha: Math.random() * 0.8 + 0.2
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha + Math.sin(Date.now() / 300) * 0.3;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawStars();

            const colors = ['#00ff00', '#00ffff', '#0088ff', '#4400ff', '#aa00ff', '#ff00ff', '#ff0088', '#ff4400', '#ffaa00', '#ffff00'];

            // Body segments
            for (let i = 1; i < snake.length; i++) {
                ctx.fillStyle = colors[(i-1) % colors.length];
                ctx.fillRect(snake[i].x * grid, snake[i].y * grid, grid, grid);
            }

            // Head is always green
            const head = snake[0];
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(head.x * grid, head.y * grid, grid, grid);

            // Eyes
            ctx.fillStyle = '#000';
            const eyeSize = 6;
            const eyeOffset = 5;
            if (dx === 1) {
                ctx.fillRect(head.x*grid + 13, head.y*grid + eyeOffset, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 13, head.y*grid + grid - eyeOffset - eyeSize, eyeSize, eyeSize);
            } else if (dx === -1) {
                ctx.fillRect(head.x*grid + 2, head.y*grid + eyeOffset, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + 2, head.y*grid + grid - eyeOffset - eyeSize, eyeSize, eyeSize);
            } else if (dy === -1) {
                ctx.fillRect(head.x*grid + eyeOffset, head.y*grid + 2, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + grid - eyeOffset - eyeSize, head.y*grid + 2, eyeSize, eyeSize);
            } else {
                ctx.fillRect(head.x*grid + eyeOffset, head.y*grid + 13, eyeSize, eyeSize);
                ctx.fillRect(head.x*grid + grid - eyeOffset - eyeSize, head.y*grid + 13, eyeSize, eyeSize);
            }

            // Clean Y-forked tongue - completely new drawing
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const hx = head.x * grid + grid / 2;
            const hy = head.y * grid + grid / 2;
            const len = 16;

            ctx.beginPath();
            if (dx === 1) { // right
                ctx.moveTo(hx + 11, hy);
                ctx.lineTo(hx + len, hy);
                ctx.moveTo(hx + 11, hy - 2);
                ctx.lineTo(hx + len - 2, hy - 8);
                ctx.moveTo(hx + 11, hy + 2);
                ctx.lineTo(hx + len - 2, hy + 8);
            } else if (dx === -1) { // left
                ctx.moveTo(hx - 11, hy);
                ctx.lineTo(hx - len, hy);
                ctx.moveTo(hx - 11, hy - 2);
                ctx.lineTo(hx - len + 2, hy - 8);
                ctx.moveTo(hx - 11, hy + 2);
                ctx.lineTo(hx - len + 2, hy + 8);
            } else if (dy === -1) { // up
                ctx.moveTo(hx, hy - 11);
                ctx.lineTo(hx, hy - len);
                ctx.moveTo(hx - 2, hy - 11);
                ctx.lineTo(hx - 8, hy - len + 2);
                ctx.moveTo(hx + 2, hy - 11);
                ctx.lineTo(hx + 8, hy - len + 2);
            } else { // down
                ctx.moveTo(hx, hy + 11);
                ctx.lineTo(hx, hy + len);
                ctx.moveTo(hx - 2, hy + 11);
                ctx.lineTo(hx - 8, hy + len - 2);
                ctx.moveTo(hx + 2, hy + 11);
                ctx.lineTo(hx + 8, hy + len - 2);
            }
            ctx.stroke();

            // Food matches next segment color
            ctx.fillStyle = colors[snake.length % colors.length];
            ctx.beginPath();
            ctx.arc(food.x * grid + grid/2, food.y * grid + grid/2, grid/2 - 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function update() {
            if (gameOverFlag) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= canvas.width/grid || head.y < 0 || head.y >= canvas.height/grid) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (segment.x === head.x && segment.y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
                randomFood();
                if (speed > 90) speed -= 3;
            } else {
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            gameOverFlag = true;
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }
            document.getElementById('finalScore').innerText = `Score: ${score}`;
            document.getElementById('gameOver').style.display = 'block';
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            speed = 180;
            gameOverFlag = false;
            document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
            document.getElementById('gameOver').style.display = 'none';
            randomFood();
            initStars();
            clearInterval(gameInterval);
            gameInterval = setInterval(update, speed);
            draw();
        }

        function restartGame() {
            startGame();
        }

        // Controls
        document.getElementById('up').addEventListener('click', () => { if (dy !== 1) { dx = 0; dy = -1; } });
        document.getElementById('down').addEventListener('click', () => { if (dy !== -1) { dx = 0; dy = 1; } });
        document.getElementById('left').addEventListener('click', () => { if (dx !== 1) { dx = -1; dy = 0; } });
        document.getElementById('right').addEventListener('click', () => { if (dx !== -1) { dx = 1; dy = 0; } });

        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });
        canvas.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && dx !== -1) { dx = 1; dy = 0; }
                else if (diffX < -30 && dx !== 1) { dx = -1; dy = 0; }
            } else {
                if (diffY > 30 && dy !== -1) { dx = 0; dy = 1; }
                else if (diffY < -30 && dy !== 1) { dx = 0; dy = -1; }
            }
        });

        document.addEventListener('keydown', e => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key) > -1) e.preventDefault();
            if (e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; }
            if (e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; }
            if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
            if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
        });

        document.getElementById('restart').addEventListener('click', restartGame);

        startGame();
    </script>
</body>
</html>
