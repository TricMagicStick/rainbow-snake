<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rainbow Snake">
    <link rel="manifest" href="manifest.json">
    <title>Rainbow Snake</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
        body { background: #1a0033; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        h1 { margin: 12px 0 6px; font-size: 2.0em; font-weight: 700; letter-spacing: -1px; background: linear-gradient(90deg, #ff0080, #ff8c00, #ffeb3b, #00ff9d, #00b0ff, #ff00ff, #ff0080); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 300% 100%; animation: rainbow-shift 4s linear infinite; }
        @keyframes rainbow-shift { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
        #score { font-size: 1em; margin-bottom: 2px; color: #cccccc; }
        #debug { font-size: 0.65em; color: #666; margin: 2px 0 10px; font-family: monospace; text-align: center; }
        #game-container { position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.4); border: 3px solid #ffffff33; border-radius: 16px; background: #000; overflow: hidden; max-width: 92vw; width: 400px; height: 400px; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #restart { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; background: #0088ff; color: white; border: 2px solid #ffffff55; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,136,255,0.4); z-index: 20; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        #restart:active { background: #0066cc; transform: scale(0.9); }
        .controls { margin-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 280px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        button { background: #333; color: white; border: 1px solid #ffffff33; border-radius: 14px; font-size: 26px; width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform 0.05s ease, background 0.05s ease; }
        button:active { background: #444; transform: scale(0.92); }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.94); padding: 24px 20px; border-radius: 16px; text-align: center; display: none; border: 2px solid #ff00ff; width: 86%; max-width: 240px; box-sizing: border-box; z-index: 30; }
        #gameOver h2 { color: #ff3333; margin: 0 0 12px 0; font-size: 1.5em; animation: pulse-red 1.1s infinite ease-in-out; }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.92; } }
        #gameOver button { background: #1a001a; color: white; border: 2px solid #ff00ff; border-radius: 12px; padding: 12px 28px; font-size: 16px; margin-top: 12px; cursor: pointer; }
        #gameOver button:active { background: #330033; }
        #finalScore { color: #cccccc; margin: 6px 0 0; font-size: 1em; }
    </style>
</head>
<body>
    <h1>Rainbow Snake</h1>
    <div id="score">Score: 0 | High Score: 0</div>
    <div id="debug">v16.3.0 - growth fixed + tongue fix</div>

    <div id="game-container">
        <canvas id="game" width="400" height="400"></canvas>
        <button id="restart" onclick="restartGame()" aria-label="Restart">⟳</button>
        <div id="gameOver">
            <h2>Game Over!</h2>
            <p id="finalScore">Score: 0</p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <div class="controls">
        <button id="up" aria-label="Up">↑</button>
        <div class="dpad">
            <button id="left" aria-label="Left">←</button>
            <button id="down" aria-label="Down">↓</button>
            <button id="right" aria-label="Right">→</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d', { alpha: true });
        const GRID = 20;
        const COLS = 20;
        const ROWS = 20;

        let snake = [];
        let dx = 1;
        let dy = 0;
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('highScore')) || 0;
        let gameRunning = false;
        let lastMoveTime = 0;
        const moveDelay = 155;
        let eatEffects = [];
        let stars = [];
        let frameCount = 0;
        let nextBodyHue = 220;

        const scoreEl = document.getElementById('score');
        const debugEl = document.getElementById('debug');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        function updateScoreDisplay() { scoreEl.innerText = `Score: ${score} | High Score: ${highScore}`; }

        function initStars() {
            stars = [];
            for (let i = 0; i < 65; i++) {
                stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 1.8 + 0.6, twinkle: Math.random() * Math.PI * 2, speed: Math.random() * 0.035 + 0.012 });
            }
        }

        function drawStarfield(t) {
            for (let s of stars) {
                s.twinkle += s.speed;
                const alpha = 0.35 + Math.sin(s.twinkle) * 0.65;
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            }
        }

        function placeFood() {
            let newFood; let attempts = 0;
            do {
                newFood = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
                attempts++;
            } while (attempts < 50 && snake.some(s => s.x === newFood.x && s.y === newFood.y));
            food = newFood;
        }

        function getNextBodyHue() { const h = nextBodyHue; nextBodyHue = (nextBodyHue + 45) % 360; return h; }

        function drawSnakeBody() {
            if (snake.length < 2) return;
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            const bodyWidth = 0.78;
            for (let i = snake.length - 1; i >= 1; i--) {
                const seg = snake[i]; const prevSeg = snake[i - 1];
                const x1 = seg.x * GRID + GRID / 2; const y1 = seg.y * GRID + GRID / 2;
                const x2 = prevSeg.x * GRID + GRID / 2; const y2 = prevSeg.y * GRID / 2;
                const distFromTail = (snake.length - 1) - i; const taperSegments = 7;
                let taperFactor = (distFromTail < taperSegments) ? bodyWidth * (0.35 + 0.65 * (distFromTail / (taperSegments - 1))) : bodyWidth;
                ctx.lineWidth = GRID * taperFactor;
                const hue = seg.hue ?? ((i * 45 + 170) % 360);
                ctx.strokeStyle = `hsl(${hue}, 92%, 58%)`;
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            }
        }

        function drawHead(t) {
            if (snake.length === 0) return;
            const head = snake[0]; const hx = head.x * GRID + GRID / 2; const hy = head.y * GRID + GRID / 2; const angle = Math.atan2(dy, dx);
            const forwardOffset = 2.8; const hdx = hx + Math.cos(angle) * forwardOffset; const hdy = hy + Math.sin(angle) * forwardOffset;
            ctx.save(); ctx.translate(hdx, hdy); ctx.rotate(angle);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.28)'; ctx.beginPath(); ctx.ellipse(3, 4, GRID * 0.52, GRID * 0.46, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#22cc55'; ctx.beginPath(); ctx.ellipse(0, 0, GRID * 0.52, GRID * 0.46, 0, 0, Math.PI * 2); ctx.fill();
            const gloss = ctx.createLinearGradient(-GRID * 0.35, -GRID * 0.38, GRID * 0.25, GRID * 0.25); gloss.addColorStop(0, 'rgba(200, 255, 200, 0.55)'); gloss.addColorStop(0.6, 'rgba(200, 255, 200, 0)'); ctx.fillStyle = gloss; ctx.beginPath(); ctx.ellipse(-GRID * 0.08, -GRID * 0.18, GRID * 0.32, GRID * 0.26, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            const eyeDist = GRID * 0.175; const eyeFwd = GRID * 0.10; const eyePerp = Math.PI / 2;
            const leftEyeX = hdx + Math.cos(angle) * eyeFwd + Math.cos(angle + eyePerp) * eyeDist; const leftEyeY = hdy + Math.sin(angle) * eyeFwd + Math.sin(angle + eyePerp) * eyeDist;
            const rightEyeX = hdx + Math.cos(angle) * eyeFwd - Math.cos(angle + eyePerp) * eyeDist; const rightEyeY = hdy + Math.sin(angle) * eyeFwd - Math.sin(angle + eyePerp) * eyeDist;
            const eyeRadius = GRID * 0.085;
            ctx.fillStyle = '#0d1f0d'; ctx.beginPath(); ctx.arc(leftEyeX, leftEyeY, eyeRadius, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(rightEyeX, rightEyeY, eyeRadius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ccffcc'; ctx.beginPath(); ctx.arc(leftEyeX - eyeRadius * 0.32, leftEyeY - eyeRadius * 0.32, GRID * 0.018, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(rightEyeX - eyeRadius * 0.32, rightEyeY - eyeRadius * 0.32, GRID * 0.018, 0, Math.PI * 2); ctx.fill();
            const mouthX = hdx + Math.cos(angle) * (GRID * 0.46); const mouthY = hdy + Math.sin(angle) * (GRID * 0.46);
            const inOut = (Math.sin(t * 5.2) + 1) * 0.5; const sideFlick = Math.sin(t * 4.0) * 0.20;
            ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const stemLen = GRID * 0.12 * inOut; const stemEndX = mouthX + Math.cos(angle) * stemLen; const stemEndY = mouthY + Math.sin(angle) * stemLen;
            ctx.beginPath(); ctx.moveTo(mouthX, mouthY); ctx.lineTo(stemEndX, stemEndY); ctx.stroke();
            const forkLen = GRID * 0.40 * (0.35 + 0.65 * inOut); const angleL = angle - 0.46 + sideFlick; const angleR = angle + 0.46 - sideFlick;
            let endLX = stemEndX + Math.cos(angleL) * forkLen; let endLY = stemEndY + Math.sin(angleL) * forkLen; let ctrlLX = stemEndX + Math.cos(angleL) * (forkLen * 0.5) + Math.cos(angleL + 1.05) * 3; let ctrlLY = stemEndY + Math.sin(angleL) * (forkLen * 0.5) + Math.sin(angleL + 1.05) * 3;
            ctx.beginPath(); ctx.moveTo(stemEndX, stemEndY); ctx.quadraticCurveTo(ctrlLX, ctrlLY, endLX, endLY); ctx.stroke();
            let endRX = stemEndX + Math.cos(angleR) * forkLen; let endRY = stemEndY + Math.sin(angleR) * forkLen; let ctrlRX = stemEndX + Math.cos(angleR) * (forkLen * 0.5) + Math.cos(angleR - 1.05) * 3; let ctrlRY = stemEndY + Math.sin(angleR) * (forkLen * 0.5) + Math.sin(angleR - 1.05) * 3;
            ctx.beginPath(); ctx.moveTo(stemEndX, stemEndY); ctx.quadraticCurveTo(ctrlRX, ctrlRY, endRX, endRY); ctx.stroke();
        }

        function drawFood() {
            const fx = food.x * GRID + GRID / 2; const fy = food.y * GRID + GRID / 2; const r = GRID * 0.38;
            const foodHue = nextBodyHue;
            ctx.fillStyle = `hsla(${foodHue}, 92%, 75%, 0.3)`; ctx.beginPath(); ctx.arc(fx, fy, r * 1.4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = `hsl(${foodHue}, 92%, 65%)`; ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(fx - r * 0.25, fy - r * 0.25, r * 0.35, 0, Math.PI * 2); ctx.fill();
        }

        function updateAndDrawEffects() {
            for (let i = eatEffects.length - 1; i >= 0; i--) {
                const e = eatEffects[i]; e.life--;
                if (e.life <= 0) { eatEffects.splice(i, 1); continue; }
                const progress = 1 - (e.life / 28); const alpha = 0.75 * (1 - progress);
                if (e.type === 'ring') { ctx.strokeStyle = `rgba(255, 200, 120, ${alpha})`; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(e.x, e.y, 8 + progress * 28, 0, Math.PI * 2); ctx.stroke(); }
                else if (e.type === 'poof') { ctx.fillStyle = `rgba(255, 255, 210, ${alpha * 0.9})`; for (let k = 0; k < 6; k++) { const ang = (k / 6) * Math.PI * 2 + progress * 2.2; const dist = progress * 14 + (k % 2) * 3; ctx.beginPath(); ctx.arc(e.x + Math.cos(ang) * dist, e.y + Math.sin(ang) * dist, 2.2, 0, Math.PI * 2); ctx.fill(); } }
            }
        }

        function updateSnake() {
            if (!gameRunning) return;
            const head = snake[0];
            const newHead = { x: head.x + dx, y: head.y + dy, hue: head.hue };
            if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) { endGame(); return; }
            if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) { endGame(); return; }
            snake.unshift(newHead);
            if (newHead.x === food.x && newHead.y === food.y) {
                score++;
                updateScoreDisplay();
                // Grow: keep the new head, assign fresh rainbow hue to the new body segment that was previously the head
                const newHue = getNextBodyHue();
                if (snake.length > 1) {
                    snake[1].hue = newHue;
                }
                const fx = food.x * GRID + GRID / 2;
                const fy = food.y * GRID + GRID / 2;
                eatEffects.push({ x: fx, y: fy, life: 26, type: 'ring' });
                eatEffects.push({ x: fx, y: fy, life: 17, type: 'poof' });
                for (let p = 0; p < 2; p++) {
                    eatEffects.push({ x: fx + (Math.random() - 0.5) * 10, y: fy + (Math.random() - 0.5) * 10, life: 11 + Math.random() * 7, type: 'poof' });
                }
                placeFood();
            } else {
                snake.pop();
            }
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
                updateScoreDisplay();
            }
        }

        function draw() { frameCount++; const t = Date.now() / 1000; ctx.fillStyle = '#0a001f'; ctx.fillRect(0, 0, canvas.width, canvas.height); drawStarfield(t); drawSnakeBody(); drawHead(t); drawFood(); updateAndDrawEffects(); }

        function gameLoop() { const now = Date.now(); if (gameRunning && now - lastMoveTime >= moveDelay) { updateSnake(); lastMoveTime = now; } draw(); requestAnimationFrame(gameLoop); }

        function endGame() { gameRunning = false; finalScoreEl.innerText = `Score: ${score}`; gameOverEl.style.display = 'block'; }

        function startGame() { nextBodyHue = 220; snake = [{ x: 8, y: 10, hue: 120 }, { x: 7, y: 10, hue: 175 }]; dx = 1; dy = 0; score = 0; eatEffects = []; gameRunning = true; lastMoveTime = Date.now(); gameOverEl.style.display = 'none'; updateScoreDisplay(); placeFood(); }

        function restartGame() { startGame(); }

        function setupControls() {
            document.getElementById('up').addEventListener('click', () => { if (dy !== 1) { dx = 0; dy = -1; } });
            document.getElementById('down').addEventListener('click', () => { if (dy !== -1) { dx = 0; dy = 1; } });
            document.getElementById('left').addEventListener('click', () => { if (dx !== 1) { dx = -1; dy = 0; } });
            document.getElementById('right').addEventListener('click', () => { if (dx !== -1) { dx = 1; dy = 0; } });
            document.addEventListener('keydown', (e) => {
                if (!gameRunning && e.key.toLowerCase() === 'r') { restartGame(); return; }
                if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') { if (dy !== 1) { dx = 0; dy = -1; } }
                if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') { if (dy !== -1) { dx = 0; dy = 1; } }
                if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') { if (dx !== 1) { dx = -1; dy = 0; } }
                if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') { if (dx !== -1) { dx = 1; dy = 0; } }
            });
        }

        function setupSwipeControls() {
            const gameArea = document.getElementById('game-container');
            let touchStartX = 0; let touchStartY = 0;
            gameArea.addEventListener('touchstart', (e) => { if (!gameRunning) return; touchStartX = e.changedTouches[0].clientX; touchStartY = e.changedTouches[0].clientY; }, { passive: true });
            gameArea.addEventListener('touchend', (e) => {
                if (!gameRunning) return;
                const touchEndX = e.changedTouches[0].clientX; const touchEndY = e.changedTouches[0].clientY;
                const diffX = touchEndX - touchStartX; const diffY = touchEndY - touchStartY; const threshold = 28;
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > threshold && dx !== -1) { dx = 1; dy = 0; }
                    else if (diffX < -threshold && dx !== 1) { dx = -1; dy = 0; }
                } else {
                    if (diffY > threshold && dy !== -1) { dx = 0; dy = 1; }
                    else if (diffY < -threshold && dy !== 1) { dx = 0; dy = -1; }
                }
            }, { passive: true });
        }

        function init() {
            initStars(); setupControls(); setupSwipeControls(); updateScoreDisplay();
            debugEl.innerText = 'v16.3.0 - growth fixed + tongue fix';
            startGame(); gameLoop();
        }
        init();
    </script>
</body>
</html>
